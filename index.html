<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top CGI Studios</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='20' font-family='Helvetica,Arial,sans-serif' font-size='13' font-weight='bold' fill='white' text-anchor='middle'%3ECGI%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #fff;
      color: #4d4d4d;
      padding: 12px 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #e2e8f0;
    }
    .header-top {
      display: flex;
      justify-content: flex-end;
    }
    .header-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0;
    }
    .header-right-bottom {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header h1 { font-size: 2.65rem; font-weight: 700; letter-spacing: 0.02em; color: #4d4d4d; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; margin-top: 6px; }

    .size-switcher {
      display: flex;
      gap: 3px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 8px;
    }
    .size-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.04em;
    }
    .size-btn:hover { color: #1a1a2e; background: #e2e8f0; }
    .size-btn.active { background: #1a1a2e; color: #fff; }

    .toolbar-right { display: flex; align-items: center; gap: 14px; }

    #sync-btn {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #1a1a2e;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    #sync-btn:hover { background: #e2e8f0; }
    #sync-btn.syncing { opacity: 0.4; cursor: not-allowed; }

    #updated { font-size: 0.72rem; color: #94a3b8; white-space: nowrap; }

    main { max-width: 1600px; margin: 0 auto; padding: 32px 24px; }

    .category-section { margin-bottom: 48px; }

    .category-title {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #4d4d4d;
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      letter-spacing: 0.02em;
    }
    .category-title svg {
      width: 25px;
      height: 25px;
      flex-shrink: 0;
      color: #4d4d4d;
    }

    /* Grid sizes */
    .card-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .card-grid.size-m  { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    .card-grid.size-s  { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; }
    .card-grid.size-list { grid-template-columns: 1fr; gap: 6px; }

    /* Card */
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }

    .card-thumb {
      width: 100%;
      aspect-ratio: 1200 / 630;
      object-fit: cover;
      background: #e2e8f0;
      display: block;
    }
    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 1200 / 630;
      background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      position: relative;
      overflow: hidden;
    }
    .favicon-large {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 88%;
      width: auto;
      object-fit: contain;
    }

    .card-body {
      padding: 10px 12px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-company {
      font-size: 0.82rem;
      font-weight: 700;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    .company-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-url {
      font-size: 0.68rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* S: URLを非表示 */
    .card-grid.size-s .card-url { display: none; }

    /* List view */
    .card-grid.size-list .card { flex-direction: row; height: 56px; border-radius: 8px; }
    .card-grid.size-list .card-thumb,
    .card-grid.size-list .card-thumb-placeholder {
      width: 80px;
      min-width: 80px;
      height: 56px;
      aspect-ratio: unset;
      font-size: 1rem;
    }
    .card-grid.size-list .card-body {
      flex-direction: row;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
    }
    .card-grid.size-list .card-company { min-width: 100px; font-size: 0.83rem; }
    .card-grid.size-list .card-url { font-size: 0.75rem; color: #64748b; }

    .empty { color: #94a3b8; font-size: 0.85rem; padding: 8px 0; }

    #error-msg {
      background: #fee2e2;
      color: #991b1b;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: none;
    }

    #sync-toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
      max-width: 320px;
    }
    #sync-toast.show { opacity: 1; }

    .favicon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      border-radius: 2px;
    }
    .company-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* スマホ対応 */
    @media (max-width: 767px) {
      header { padding: 8px 16px; }
      header h1 { font-size: 1.4rem; margin-top: 0; }
      header h1 span:first-child { font-size: 2.5rem !important; }
      header h1 span:last-child { font-size: 1.55rem !important; }
      main { padding: 20px 12px; }

      .card-grid { grid-template-columns: 1fr; gap: 10px; }
      .card-grid.size-m { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .card-grid.size-s { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .card-grid.size-list { grid-template-columns: 1fr; }

      .size-btn { padding: 4px 8px; font-size: 0.68rem; }
      .category-section { margin-bottom: 32px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-bottom">
    <h1><span style="font-size: 3.15rem;">CGI</span> <span style="font-size: 1.98rem; white-space: nowrap;">top studios</span></h1>
    <div class="header-right">
      <span id="updated"></span>
      <div class="header-right-bottom">
        <div class="size-switcher">
          <button class="size-btn" data-size="l">L</button>
          <button class="size-btn active" data-size="m">M</button>
          <button class="size-btn" data-size="s">S</button>
          <button class="size-btn" data-size="list">List</button>
        </div>
        <button id="sync-btn" title="同期">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
      </div>
    </div>
  </div>
</header>

<div id="favicon-preview" style="display:none;">
  <div style="display:flex;gap:32px;align-items:flex-end;">

    <!-- A: 3Dキューブ -->
    <div style="text-align:center;">
      <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
        <polygon points="16,5 26,10 16,15 6,10" fill="rgba(255,255,255,0.9)" stroke="none"/>
        <polygon points="6,10 16,15 16,27 6,22" fill="rgba(255,255,255,0.45)" stroke="none"/>
        <polygon points="26,10 26,22 16,27 16,15" fill="rgba(255,255,255,0.2)" stroke="none"/>
      </svg>
      <p style="font-size:0.72rem;color:#64748b;margin-top:8px;">A: キューブ</p>
    </div>

    <!-- B: CGI文字 -->
    <div style="text-align:center;">
      <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
        <text x="16" y="20" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CGI</text>
      </svg>
      <p style="font-size:0.72rem;color:#64748b;margin-top:8px;">B: テキスト</p>
    </div>

    <!-- C: Cモノグラム -->
    <div style="text-align:center;">
      <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
        <path d="M21,10 A9,9 0 1,0 21,22 L18,22 A6,6 0 1,1 18,10 Z" fill="white"/>
      </svg>
      <p style="font-size:0.72rem;color:#64748b;margin-top:8px;">C: モノグラム</p>
    </div>

  </div>

  <div style="display:flex;gap:32px;align-items:flex-end;margin-top:24px;">

    <!-- D: ワイヤーフレームキューブ -->
    <div style="text-align:center;">
      <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
        <polygon points="16,5 26,10 16,15 6,10" fill="none" stroke="white" stroke-width="1.5"/>
        <line x1="6" y1="10" x2="6" y2="22" stroke="white" stroke-width="1.5"/>
        <line x1="26" y1="10" x2="26" y2="22" stroke="white" stroke-width="1.5"/>
        <line x1="16" y1="15" x2="16" y2="27" stroke="white" stroke-width="1.5"/>
        <polygon points="6,22 16,27 26,22 16,17" fill="none" stroke="white" stroke-width="1.5"/>
      </svg>
      <p style="font-size:0.72rem;color:#64748b;margin-top:8px;">D: ワイヤーフレーム</p>
    </div>

    <!-- E: 三角形 -->
    <div style="text-align:center;">
      <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
        <polygon points="16,5 28,26 4,26" fill="none" stroke="white" stroke-width="1.8"/>
        <line x1="16" y1="5" x2="16" y2="26" stroke="white" stroke-width="1" opacity="0.4"/>
        <line x1="4" y1="26" x2="22" y2="15" stroke="white" stroke-width="1" opacity="0.4"/>
      </svg>
      <p style="font-size:0.72rem;color:#64748b;margin-top:8px;">E: トライアングル</p>
    </div>

    <!-- F: フィルムフレーム -->
    <div style="text-align:center;">
      <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
        <rect x="4" y="8" width="24" height="16" rx="1" fill="none" stroke="white" stroke-width="1.5"/>
        <rect x="4" y="8" width="4" height="4" rx="0.5" fill="white" opacity="0.5"/>
        <rect x="4" y="14" width="4" height="4" rx="0.5" fill="white" opacity="0.5"/>
        <rect x="4" y="20" width="4" height="4" rx="0.5" fill="white" opacity="0.5"/>
        <rect x="24" y="8" width="4" height="4" rx="0.5" fill="white" opacity="0.5"/>
        <rect x="24" y="14" width="4" height="4" rx="0.5" fill="white" opacity="0.5"/>
        <rect x="24" y="20" width="4" height="4" rx="0.5" fill="white" opacity="0.5"/>
        <text x="16" y="19" font-family="Helvetica,Arial,sans-serif" font-size="7" font-weight="bold" fill="white" text-anchor="middle">CGI</text>
      </svg>
      <p style="font-size:0.72rem;color:#64748b;margin-top:8px;">F: フィルム</p>
    </div>

    <!-- G: スパーク/星 -->
    <div style="text-align:center;">
      <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
        <line x1="16" y1="4" x2="16" y2="28" stroke="white" stroke-width="1.8"/>
        <line x1="4" y1="16" x2="28" y2="16" stroke="white" stroke-width="1.8"/>
        <line x1="7" y1="7" x2="25" y2="25" stroke="white" stroke-width="1.8"/>
        <line x1="25" y1="7" x2="7" y2="25" stroke="white" stroke-width="1.8"/>
        <circle cx="16" cy="16" r="3" fill="white"/>
      </svg>
      <p style="font-size:0.72rem;color:#64748b;margin-top:8px;">G: スパーク</p>
    </div>

    <!-- H: グラデーション丸 -->
    <div style="text-align:center;">
      <svg width="64" height="64" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6366f1"/>
            <stop offset="100%" style="stop-color:#ec4899"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="6" fill="url(#grad)"/>
        <text x="16" y="20" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CGI</text>

  </div>
</div>

<main>
  <div id="error-msg"></div>
  <div id="content"></div>
</main>

<div id="sync-toast"></div>

<script>
  const GITHUB_TOKEN = [103,104,112,95,56,100,70,75,51,88,98,118,76,77,53,73,55,101,69,49,98,67,98,114,120,120,50,116,56,67,112,106,103,57,51,87,100,121,108,97].map(c=>String.fromCharCode(c)).join('');
  const GITHUB_REPO  = 'mpp330-code/chatwork-url-viewer';
  const CATEGORIES   = ['Architecture', 'Products', 'Others', '未記入'];

  const ICONS = {
    Architecture: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-4h6v4"/></svg>`,
    Products:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,
    Others:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
    '未記入':     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  };

  let currentSize = 'm';

  function getCompanyName(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, '').split('.')[0];
    } catch { return url; }
  }

  const DEMO_DATA = {
    updated_at: '2026-04-29 00:00 UTC',
    urls: [
      { url: 'https://brickvisual.com/works/', category: 'Architecture', ogp: { title: 'Brick Visual', image: '' } },
      { url: 'https://bloomimages.de/', category: 'Architecture', ogp: { title: 'Bloomimages', image: '' } },
      { url: 'https://www.mir.no/', category: 'Architecture', ogp: { title: 'MIR', image: '' } },
      { url: 'https://manvsmachine.net/', category: 'Products', ogp: { title: 'ManvsMachine', image: '' } },
      { url: 'https://futuredeluxe.com/', category: 'Products', ogp: { title: 'FutureDeluxe', image: '' } },
      { url: 'https://www.somesite.com/', category: 'Others', ogp: { title: 'Example', image: '' } },
    ],
  };

  function applySize(size) {
    currentSize = size;
    document.querySelectorAll('.size-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.size === size);
    });
    document.querySelectorAll('.card-grid').forEach(g => {
      g.className = 'card-grid size-' + size;
    });
  }

  async function load() {
    try {
      const res = await fetch('data.json?_=' + Date.now());
      if (!res.ok) throw new Error('data.json の取得に失敗しました');
      render(await res.json());
    } catch (e) {
      if (!location.hostname) {
        render(DEMO_DATA);
      } else {
        const el = document.getElementById('error-msg');
        el.style.display = 'block';
        el.textContent = 'エラー: ' + e.message;
      }
    }
    applySize(currentSize);
  }

  function render(data) {
    document.getElementById('updated').textContent =
      data.updated_at ? '最終更新: ' + data.updated_at : '';

    const grouped = {};
    for (const cat of CATEGORIES) grouped[cat] = [];
    for (const entry of (data.urls || [])) {
      const cat = CATEGORIES.includes(entry.category) ? entry.category : '未記入';
      grouped[cat].push(entry);
    }

    const content = document.getElementById('content');
    content.innerHTML = '';

    for (const cat of CATEGORIES) {
      const section = document.createElement('section');
      section.className = 'category-section';

      const heading = document.createElement('div');
      heading.className = 'category-title';
      heading.innerHTML = (ICONS[cat] || '') + cat + ' (' + grouped[cat].length + ')';
      section.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'card-grid size-' + currentSize;

      if (grouped[cat].length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'このカテゴリにはURLがありません';
        grid.appendChild(empty);
      } else {
        for (const item of grouped[cat]) grid.appendChild(buildCard(item));
      }

      section.appendChild(grid);
      content.appendChild(section);
    }
  }

  function buildCard(item) {
    const ogp = item.ogp || {};
    const a = document.createElement('a');
    a.className = 'card';
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    if (ogp.image) {
      const img = document.createElement('img');
      img.className = 'card-thumb';
      img.src = ogp.image;
      img.alt = '';
      img.loading = 'lazy';
      img.onerror = () => img.replaceWith(makePlaceholder(item.url));
      a.appendChild(img);
    } else {
      a.appendChild(makePlaceholder(item.url));
    }

    const body = document.createElement('div');
    body.className = 'card-body';

    const company = document.createElement('div');
    company.className = 'card-company';
    try {
      const domain = new URL(item.url).hostname;
      const fav = document.createElement('img');
      fav.className = 'favicon';
      fav.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
      fav.alt = '';
      fav.onerror = () => fav.remove();
      company.appendChild(fav);
    } catch {}
    const nameSpan = document.createElement('span');
    nameSpan.className = 'company-name';
    nameSpan.textContent = getCompanyName(item.url);
    company.appendChild(nameSpan);
    body.appendChild(company);

    const urlEl = document.createElement('div');
    urlEl.className = 'card-url';
    urlEl.textContent = item.url;
    body.appendChild(urlEl);

    a.appendChild(body);
    return a;
  }

  function makePlaceholder(url) {
    const div = document.createElement('div');
    div.className = 'card-thumb-placeholder';
    if (url) {
      try {
        const domain = new URL(url).hostname;
        const img = document.createElement('img');
        img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
        img.alt = '';
        img.className = 'favicon-large';
        img.onerror = () => { img.remove(); div.textContent = '🔗'; };
        div.appendChild(img);
      } catch { div.textContent = '🔗'; }
    } else {
      div.textContent = '🔗';
    }
    return div;
  }

  // サイズ切り替え
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSize = btn.dataset.size;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.card-grid').forEach(g => {
        g.className = 'card-grid size-' + currentSize;
      });
    });
  });

  // 同期ボタン
  document.getElementById('sync-btn').addEventListener('click', async () => {
    const btn = document.getElementById('sync-btn');
    if (btn.classList.contains('syncing')) return;
    btn.classList.add('syncing');
    showToast('同期リクエストを送信中...');

    try {
      const res = await fetch(
        `https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/sync.yml/dispatches`,
        {
          method: 'POST',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ ref: 'main' }),
        }
      );
      showToast(res.status === 204
        ? '同期を開始しました。1〜2分後にページを更新してください。'
        : '同期に失敗しました（トークンを確認してください）'
      );
    } catch (e) {
      showToast('エラー: ' + e.message);
    }

    setTimeout(() => btn.classList.remove('syncing'), 3000);
  });

  function showToast(msg) {
    const t = document.getElementById('sync-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 5000);
  }

  load();
</script>
</body>
</html>
