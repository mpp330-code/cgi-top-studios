<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatwork URL Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.02em; }
    #updated { font-size: 0.78rem; color: #aaa; white-space: nowrap; }

    main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }

    .category-section { margin-bottom: 48px; }

    .category-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      padding: 6px 14px;
      border-radius: 6px;
      display: inline-block;
    }
    .cat-Architecture { background: #dbeafe; color: #1d4ed8; }
    .cat-Products     { background: #dcfce7; color: #15803d; }
    .cat-Others       { background: #fef9c3; color: #92400e; }
    .cat-未記入       { background: #f1f5f9; color: #64748b; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 1200 / 630;
      object-fit: cover;
      background: #e2e8f0;
      display: block;
    }
    .card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 1200 / 630;
      background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .card-title { font-size: 0.9rem; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-desc  { font-size: 0.78rem; color: #64748b; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
    .card-url   { font-size: 0.72rem; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: auto; padding-top: 8px; border-top: 1px solid #f1f5f9; }

    .empty { color: #94a3b8; font-size: 0.9rem; padding: 12px 0; }

    #error-msg {
      background: #fee2e2;
      color: #991b1b;
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 24px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Chatwork URL Viewer</h1>
    <span id="updated">読み込み中...</span>
  </header>

  <main>
    <div id="error-msg"></div>
    <div id="content"></div>
  </main>

  <script>
    const CATEGORIES = ["Architecture", "Products", "Others", "未記入"];

    async function load() {
      try {
        const res = await fetch("data.json?_=" + Date.now());
        if (!res.ok) throw new Error("data.json の取得に失敗しました");
        const data = await res.json();
        render(data);
      } catch (e) {
        const el = document.getElementById("error-msg");
        el.style.display = "block";
        if (location.protocol === "file:") {
          el.textContent = "ローカルプレビューでは表示できません。GitHub Pages にアップロード後に正しく表示されます。";
        } else {
          el.textContent = "エラー: " + e.message;
        }
      }
    }

    function render(data) {
      document.getElementById("updated").textContent =
        data.updated_at ? "最終更新: " + data.updated_at : "";

      const grouped = {};
      for (const cat of CATEGORIES) grouped[cat] = [];
      for (const entry of (data.urls || [])) {
        const cat = CATEGORIES.includes(entry.category) ? entry.category : "未記入";
        grouped[cat].push(entry);
      }

      const content = document.getElementById("content");
      content.innerHTML = "";

      for (const cat of CATEGORIES) {
        const items = grouped[cat];
        const section = document.createElement("section");
        section.className = "category-section";

        const heading = document.createElement("div");
        heading.className = "category-title cat-" + cat;
        heading.textContent = cat + " (" + items.length + ")";
        section.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "card-grid";

        if (items.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "このカテゴリにはURLがありません";
          grid.appendChild(empty);
        } else {
          for (const item of items) {
            grid.appendChild(buildCard(item));
          }
        }

        section.appendChild(grid);
        content.appendChild(section);
      }
    }

    function buildCard(item) {
      const ogp = item.ogp || {};
      const a = document.createElement("a");
      a.className = "card";
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      if (ogp.image) {
        const img = document.createElement("img");
        img.className = "card-thumb";
        img.src = ogp.image;
        img.alt = ogp.title || "";
        img.loading = "lazy";
        img.onerror = () => img.replaceWith(placeholder());
        a.appendChild(img);
      } else {
        a.appendChild(placeholder());
      }

      const body = document.createElement("div");
      body.className = "card-body";

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = ogp.title || item.url;
      body.appendChild(title);

      if (ogp.description) {
        const desc = document.createElement("div");
        desc.className = "card-desc";
        desc.textContent = ogp.description;
        body.appendChild(desc);
      }

      const urlEl = document.createElement("div");
      urlEl.className = "card-url";
      urlEl.textContent = item.url;
      body.appendChild(urlEl);

      a.appendChild(body);
      return a;
    }

    function placeholder() {
      const div = document.createElement("div");
      div.className = "card-thumb-placeholder";
      div.textContent = "🔗";
      return div;
    }

    load();
  </script>
</body>
</html>
